name: payping-bot

service:
  name: payping-bot
  type: web

  # Deploy from GitHub Container Registry
  docker:
    image: ghcr.io/tundraray/payping_bot:latest

  # Instance configuration (free tier)
  instance_type: free
  regions:
    - fra  # Frankfurt, closest to Eastern Europe

  # Scaling
  autoscaling:
    min: 1
    max: 1

  # Port configuration
  ports:
    - port: 8000
      protocol: http

  # Health check
  health_checks:
    - path: /health
      port: 8000
      protocol: http
      interval: 30
      timeout: 10
      healthy_threshold: 2
      unhealthy_threshold: 3

  # Environment variables (set these in Koyeb dashboard)
  # env:
  #   - key: DATABASE_URL
  #     value: "your-database-url"
  #   - key: BOT_TOKEN
  #     value: "your-telegram-bot-token"
  #   - key: TRON_WALLET_ADDRESS
  #     value: "your-wallet-address"
  #   - key: TRONGRID_API_KEY
  #     value: "your-trongrid-api-key"
